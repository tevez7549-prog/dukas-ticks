name: dukas-ticks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dukas-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        year: [2026]
        months: ['2', '4', '6', '8', '10']
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas pyarrow numpy
      - name: download ${{ matrix.year }} months ${{ matrix.months }} (each finished month is pushed to branch data-dukas)
        run: |
          git config user.name dukas-bot; git config user.email bot@example.com
          cp dukas_runner.py /tmp/dukas_runner.py
          python /tmp/dukas_runner.py ${{ matrix.year }} /tmp/out ${{ matrix.months }}
